services:
  media_manager:
    image: ghcr.io/bbareth/media_manager:latest
    container_name: media_manager
    ports:
      # Bind to all interfaces only if you trust everything that can reach this
      # host — there is no authentication. To keep it local, use "127.0.0.1:8080:8080".
      - "8080:8080"
    environment:
      # How long (seconds) downloaded/converted files live before auto-deletion.
      # Default is one day. Lower it to keep less on disk.
      MEDIA_RETENTION_SECS: "86400"
      PORT: "8080"
    volumes:
      # Transient working storage. Files here are auto-deleted after the
      # retention window, so it does not need backups.
      #
      # Option A (default): a Docker named volume. Lives under
      # /var/lib/docker/volumes on the host — make sure THAT disk has space.
      - media_data:/data
      #
      # Option B: bind-mount a directory on a disk with plenty of free space.
      # Recommended when the Docker root disk is small. Comment out the line
      # above, uncomment the one below, and create the folder first.
      # - /srv/media_manager_data:/data
      #
      # The container runs as uid 10001, so a bind-mounted directory has to be
      # writable by it:  sudo chown -R 10001:10001 /srv/media_manager_data
    # The image ships its own HEALTHCHECK; no need to repeat it here.
    restart: unless-stopped

volumes:
  media_data:
